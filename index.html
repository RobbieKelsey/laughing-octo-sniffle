function screenProfile(){
  if(!state.user)
    return `<div class="app-empty">${icon('user','xl')}<b>Not signed in yet</b>
      <span>Your account is created automatically the first time you get a pass or membership.</span></div>`;
  let h=`<div class="acct">
      <div class="acct-av">${esc((state.user.name||'?').slice(0,1))}</div>
      <b>${esc(state.user.name)}</b>
      <span>${esc(PERSON.email)}</span>
    </div>`;
  h+=`<dl class="pass-meta flush">
      <div><dt>Customer ID</dt><dd class="mono">${esc(state.user.clientUserId)}</dd></div>
      ${state.pass?`<div><dt>${state.pass.type==='membership'?'Membership':'E-pass'}</dt>
        <dd class="mono">${esc(state.pass.membershipId||state.pass.ePassId)}</dd></div>`:''}
    </dl>`;
  return h;
}

/* ----- wire app interactions ----- */
function wireApp(body){
  body.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const t=el.dataset.go;
    if(t==='home'){ setTab('home'); return; }
    if(t==='module'){ const mod=el.dataset.mod;
      if(mod==='all'){ enabledModules().forEach(k=>logCall(()=>API.resourceList(k))); }
      else logCall(()=>API.resourceList(mod));
      if(mod==='esim') state.nav._esimOpts=null;
      if(mod==='localoffer') state.nav._offerOpts=null;
      go(mod==='esim'?'esim':'module', mod); }
    if(t==='resource'){ const mod=el.dataset.mod,res=el.dataset.res;
      const r=MODULES[mod].sample.find(x=>x.id===res);
      logCall(()=>API.resourceDetails(r,mod)); go('resource',{mod,res}); }
  });
  body.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>handleAct(el.dataset));
  body.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{ state.nav._slot=b.dataset.slot; renderApp(); });
  body.querySelectorAll('[data-guest]').forEach(b=>b.onclick=()=>{
    state.nav._guests=Math.max(1,(state.nav._guests||1)+(+b.dataset.guest)); renderApp(); });
  body.querySelectorAll('[data-search]').forEach(b=>b.onclick=()=>runHubSearch(b.dataset.search));
  const sx=body.querySelector('[data-search-clear]');
  if(sx) sx.onclick=()=>{ state.searchQuery=''; state.searchHits=null; renderApp(); };
  const si=body.querySelector('#hubSearch');
  if(si) si.addEventListener('keydown',e=>{ if(e.key==='Enter') runHubSearch(si.value); });
}

/* keyword search → transport hub list (two verified calls) */
function runHubSearch(q){
  state.searchQuery=q||'';
  logCall(()=>API.keywordSearch(q));
  logCall(()=>API.transportHubs(q)).then(()=>renderApp());
  renderApp();
}

function grantEntitlements(){ enabledModules().forEach(m=>logCall(()=>API.setEntitlement(m))); }

/* Lazily create the user and issue whichever pass the current issuing model
   needs. Returns a promise so callers can chain the order that depends on it —
   in live mode the ePassId only exists once the API has answered. */
function ensurePass(mkey){
  if(state.pass) return Promise.resolve();
  if(cap('user') && !state.user) logCall(()=>API.createUser());
  if(state.cross) return logCall(()=>API.issueCrossEpass());
  if(state.solution==='epass'){
    const mk = mkey && MODULES[mkey] ? mkey : (enabledModules()[0]||'lounge');
    return logCall(()=>API.issueEpass(mk));
  }
  const p = logCall(()=>API.registerMembership());
  grantEntitlements();
  return p;
}

function handleAct(d){
  const mod=d.mod, res=d.res;
  const findRes=()=> mod && MODULES[mod]?.sample.find(x=>x.id===res);
  const findOrder=()=> state.orders.find(x=>x.id===d.order) || state.orders[0];
  const slot=()=> state.nav._slot||'10:00';
  const guests=()=> state.nav._guests||1;
  switch(d.act){
    /* ---- navigation ---- */
    case 'goBook':
      if(!MODULES[mod]?.prebook){ toast(MODULES[mod]?.label+' is walk-in only'); break; }
      state.nav._slot=null; state.nav._guests=1; go('book',{mod,res}); break;
    case 'openSearch': state.nav._esimOpts=null; state.nav._offerOpts=null; go('search'); break;
    case 'showVoucher': go('voucher',{order:d.order}); break;
    case 'showPassFor': go('pass',{ kind:'prebooking', order:d.order }); break;
    /* Opening an order fetches its detail — the eSIM one has its own endpoint. */
    case 'openOrder': {
      const o=state.orders.find(x=>x.id===d.order); if(!o) break;
      go('order',{order:d.order});
      if(o.kind==='esim') logCall(()=>API.esimLiveDetails(o));
      else if(o.kind!=='sandbox') logCall(()=>API.usageDetails(o));
      break;
    }
    /* The redemption itself, fired from the pass screen the guest is showing. */
    case 'doRedeem': {
      const r = mod && MODULES[mod]?.sample.find(x=>x.id===res);
      if(cap('sandbox')) logCall(()=>API.simulateRedemption(r,mod));
      else logCall(()=>API.walkInRedeem(r,mod));
      _callChain.then(()=>renderApp());
      toast(cap('sandbox')?'Redemption simulated':'Redeemed — webhook fired');
      break;
    }
    /* Choosing a hub goes straight to what's available there — a search result
       that dumped you back on a landing page would be a dead step. */
    case 'pickHub': {
      const hub=(state.searchHits||[]).find(h=>h.transportHubId===d.hub); if(!hub) break;
      state.hubChosen=true;
      logCall(()=>API.hubDetails(hub));
      logCall(()=>API.modulesByLocation());
      enabledModules().forEach(k=>logCall(()=>API.resourceList(k)));
      _callChain.then(()=>renderApp());
      state.nav.tab='search';
      go('module','all');
      break;
    }

    /* ---- users ---- */
    case 'createUser': logCall(()=>API.createUser()).then(()=>renderApp()); toast('User created'); break;
    case 'getUser': logCall(()=>API.getUser()); toast('User fetched'); break;
    case 'updateUser': logCall(()=>API.updateUser({ email: persona().email.replace('@','+updated@') })).then(()=>renderApp());
      toast('User updated'); break;
    case 'deleteUser': logCall(()=>API.deleteUser()).then(()=>{ resetNav(); renderAll(); }); toast('User deleted'); break;
    case 'listPasses': logCall(()=>API.listPasses()); toast('E-passes listed'); break;
    case 'listMemberships': logCall(()=>API.listMemberships()); toast('Memberships listed'); break;

    /* ---- membership ---- */
    case 'register':
      if(cap('user')&&!state.user) logCall(()=>API.createUser());
      logCall(()=>API.registerMembership()).then(()=>renderApp());
      grantEntitlements();
      toast('Membership active'); break;
    case 'membershipDetails': logCall(()=>API.membershipDetails()); toast('Membership fetched'); break;
    case 'entitlementInfo': logCall(()=>API.entitlementInfo()); toast('Entitlements fetched'); break;
    case 'suspendMembership': {
      const next = state.pass?.status===2 ? 1 : 2;
      logCall(()=>API.updateMembership(next)).then(()=>renderApp());
      toast(next===2?'Membership suspended':'Membership reactivated'); break;
    }

    /* ---- walk-in redemption ----
       Issue the pass first (creating the user implicitly), then show the pass
       so the guest has something to present. The redemption itself is fired
       from the pass screen, not here — that is the real sequence. */
    case 'walkin': {
      if(!MODULES[mod]?.walkin){ toast(MODULES[mod]?.label+' is pre-booking only'); break; }
      const r=findRes() || (mod?MODULES[mod].sample[0]:null);
      ensurePass(mod).then(()=>{
        state.nav._passCtx={ kind:'walkin', mod, res:r?.id };
        go('pass',{ kind:'walkin', mod, res:r?.id });
      });
      break;
    }

    /* ---- prebooking ---- */
    case 'preview': {
      const r=findRes(); const g=guests();
      ensurePass(mod).then(()=>{
        logCall(()=>API.availability(r,mod,slot(),g));
        logCall(()=>API.previewOrder(r,mod,g));
      });
      toast('Order previewed'); break;
    }
    case 'createOrder': {
      if(!MODULES[mod]?.prebook){ toast(MODULES[mod]?.label+' is walk-in only'); break; }
      const r=findRes(); const g=guests(); const s=slot();
      ensurePass(mod).then(()=>{
        logCall(()=>API.availability(r,mod,s,g));
        return logCall(()=>API.createPrebookingOrder(r,mod,s,g));
      }).then(()=>{
        if(cap('push')) logCall(()=>API.orderStatus(state.orders[0]));
        go('pass',{ kind:'prebooking', order: state.orders[0]?.id }, { replace:true });
        markRecipeStep('prebookLounge', 4);   // the voucher is now rendered
      });
      toast('Booking confirmed'); break;
    }
    case 'bundle': {
      const r=findRes(); const s=slot();
      if(cap('user') && !state.user) logCall(()=>API.createUser());
      logCall(()=>API.availability(r,mod,s,1));
      logCall(()=>API.bundleOrder(r,mod,s)).then(()=>{
        if(cap('push')) logCall(()=>API.orderStatus(state.orders[0]));
        go('pass',{ kind:'prebooking', order: state.orders[0]?.id }, { replace:true });
      });
      toast('Pass issued & booked'); break;
    }

    /* ---- eSIM ---- */
    case 'esimBrowse':
      state.nav._esimRes=res;
      logCall(()=>API.esimOptions(res)).then(body=>{
        state.nav._esimOpts = body?.data?.optionList || [];
        go('esim');
      });
      break;
    case 'esimOrder': {
      const o=(state.nav._esimOpts||[]).find(x=>x.optionId===d.opt); if(!o) break;
      const rid=state.nav._esimRes||'E00001';
      ensurePass('esim').then(()=>{
        logCall(()=>API.optionAvailability({id:rid},'esim',o.optionId,null,1));
        return logCall(()=>API.createEsimOrder(o));
      }).then(()=>renderApp());
      toast('eSIM activated'); go('wallet'); break;
    }
    case 'esimPackages': logCall(()=>API.esimPackages(state.orders.find(x=>x.iccid))); toast('Packages fetched'); break;
    case 'esimLive': logCall(()=>API.esimLiveDetails(state.orders.find(x=>x.iccid))); toast('Live details fetched'); break;
    case 'topup': {
      const o=state.orders.find(x=>x.module===8 && x.iccid);
      logCall(()=>API.topupAvailability(o,'E00001-01'));
      logCall(()=>API.topUp(o)).then(()=>renderApp());
      toast('Data topped up'); break;
    }

    /* ---- fitness ---- */
    case 'fitnessSchedule': {
      const r=findRes();
      logCall(()=>API.fitnessSchedule(r)).then(body=>{
        state.nav._fitOpts = body?.data?.schedules?.[0]?.optionList || [];
        state.nav._fitRes = r.id;
        go('fitness',{mod:'fitness',res});
      });
      break;
    }
    case 'fitnessOrder': {
      const r=MODULES.fitness.sample.find(x=>x.id===res); const opt=(state.nav._fitOpts||[]).find(s=>s.optionId===d.opt);
      if(!r||!opt) break;
      logCall(()=>API.fitnessOptionDetails(r,opt));
      ensurePass('fitness').then(()=>{
        logCall(()=>API.optionAvailability(r,'fitness',opt.optionId,opt.startTime,1));
        return logCall(()=>API.createFitnessOrder(r,opt));
      }).then(()=>{
        if(cap('walkin')||cap('sandbox')) logCall(()=>API.checkIn(state.orders[0]));
        renderApp();
      });
      toast('Session booked'); go('wallet'); break;
    }

    /* ---- local offer ---- */
    case 'offerBrowse':
      state.nav._offerRes=res;
      logCall(()=>API.offerOptions(res)).then(body=>{
        state.nav._offerOpts = body?.data?.optionList || [];
        go('offers',{mod:'localoffer',res});
      });
      break;
    case 'offerOrder': {
      const r=MODULES.localoffer.sample.find(x=>x.id===res)||MODULES.localoffer.sample[0];
      const opt=(state.nav._offerOpts||[]).find(o=>o.optionId===d.opt); if(!opt) break;
      logCall(()=>API.offerOptionDetails(r.id,opt.optionId,opt));
      ensurePass('localoffer').then(()=>{
        logCall(()=>API.optionAvailability(r,'localoffer',opt.optionId,'10:30',1));
        return logCall(()=>API.createOfferOrder(r,opt));
      }).then(()=>{
        if(cap('push')) logCall(()=>API.orderStatus(state.orders[0],'localOffer'));
        markRecipeStep('localOffer', 4);
        go('voucher',{ order: state.orders[0]?.id });
      });
      toast('Offer claimed'); break;
    }

    /* ---- pricing ---- */
    case 'prices': logCall(()=>API.resourcePrices(mod)); toast('Pricing fetched'); break;
    case 'optionPrices': {
      const r=MODULES[mod]?.sample.find(x=>x.id===res)||MODULES[mod]?.sample[0];
      const ids=(state.nav._fitOpts||[]).map(o=>o.optionId);
      logCall(()=>API.optionPrices(mod,r,ids)); toast('Option pricing fetched'); break;
    }

    /* ---- orders & lifecycle ---- */
    case 'usage': logCall(()=>API.usageDetails(findOrder())); toast('Usage fetched'); break;
    case 'orderList': logCall(()=>API.orderList()); toast('Orders fetched'); break;
    case 'epassDetails': logCall(()=>API.epassDetails()); toast('E-pass fetched'); break;
    case 'cancelOrder': {
      const o=findOrder();
      logCall(()=>API.cancelOrder(o)).then(()=>{
        if(cap('push')) logCall(()=>API.orderStatus(o,'lifecycle'));
        renderApp();
      });
      toast('Order cancelled'); break;
    }
    case 'cancelEpass': logCall(()=>API.cancelEpass()).then(()=>{ resetNav(); renderAll(); });
      toast('E-pass cancelled'); break;

    /* ---- sandbox simulation ---- */
    case 'simRedeem': {
      const o=findOrder();
      logCall(()=>API.simulatePrebookRedeem(o)).then(()=>renderApp());
      toast('Redemption simulated'); break;
    }
    case 'simCancel': {
      const o=findOrder();
      logCall(()=>API.simulateCancel(o)).then(()=>renderApp());
      toast('Cancellation simulated'); break;
    }

    /* ---- push events ---- */
    case 'resourceUpdate': logCall(()=>API.resourceUpdate(enabledModules()[0])); toast('Event received'); break;
    case 'eventRecovery': logCall(()=>API.eventRecovery(enabledModules()[0])); toast('Batch replayed'); break;
  }
}

/* ============================================================================
   ADMIN CONSOLE
   Everything a client integrator calls from their BACKEND rather than from the
   app: user and membership administration, pricing lookups, order history,
   cancellations, push-event replay and sandbox simulations. Keeping these out
   of the phone is what lets the phone stay a believable end-user app.
   The contextual group rebuilds on every render from the current screen.
   ========================================================================== */
function adminContextActions(){
  const nav = state.nav, out = [];
  const add = (act, label, ic, data)=> out.push({act,label,ic,data:data||{}});

  if(nav.screen==='pass' && state.pass && (state.pass.type==='epass'||state.pass.type==='cross')){
    add('epassDetails','Retrieve E-pass details','key');
    if(cap('lifecycle')) add('cancelEpass','Cancel this E-pass','ban');
  }
  if(nav.screen==='card' && state.pass?.type==='membership'){
    add('membershipDetails','Retrieve membership','credit-card');
    add('entitlementInfo','Retrieve entitlements','list');
    if(cap('lifecycle')) add('suspendMembership', (state.pass.status===2?'Reactivate':'Suspend')+' membership','toggle-off');
  }
  if(nav.screen==='order' && nav.ctx?.order){
    const o = state.orders.find(x=>x.id===nav.ctx.order);
    if(o){
      const d={order:o.id};
      add('usage','Retrieve usage details','time-past',d);
      if(o.kind==='esim'){ add('esimPackages','Data packages','list',d); add('esimLive','Live usage & validity','globe',d); }
      if(cap('sandbox') && SIM_SLUG[o.module]){
        if(o.voucher) add('simRedeem','Simulate redemption','bolt',d);
        add('simCancel','Simulate venue cancellation','bolt',d);
      }
      if(cap('lifecycle')) add('cancelOrder','Cancel this order','ban',d);
    }
  }
  if(nav.screen==='wallet' && state.orders.length)
    add('orderList', isEpass()?'E-pass order list':'Membership order list','receipt');
  if((nav.screen==='module'||nav.screen==='resource') && nav.ctx){
    const mk = typeof nav.ctx==='string' ? nav.ctx : nav.ctx.mod;
    if(mk && cap('pricing')) add('prices','Resource pricing','coins',{mod:mk});
  }
  if(nav.screen==='fitness' && cap('pricing'))
    add('optionPrices','Option pricing','coins',{mod:'fitness',res:state.nav._fitRes});
  return out;
}

function renderAdmin(){
  const wrap = document.getElementById('adminPanel');
  if(!wrap) return;
  const btn = a=>`<button class="ab" data-act="${esc(a.act)}"
    ${Object.entries(a.data||{}).map(([k,v])=>`data-${esc(k)}="${esc(v)}"`).join(' ')}>
    ${icon(a.ic)}<span>${esc(a.label)}</span></button>`;

  const ctxActions = adminContextActions();
  const groups = [];

  if(cap('user')) groups.push({ title:'User', ic:'user', items:[
    { act:'getUser', label:'Retrieve user', ic:'user' },
    { act:'listPasses', label:'List E-passes', ic:'ticket' },
    { act:'listMemberships', label:'List memberships', ic:'credit-card' },
    ...(cap('lifecycle') ? [
      { act:'updateUser', label:'Update user', ic:'refresh' },
      { act:'deleteUser', label:'Delete user', ic:'trash' }] : []),
  ]});
  if(state.solution==='membership') groups.push({ title:'Membership', ic:'credit-card', items:[
    { act:'membershipDetails', label:'Retrieve membership', ic:'credit-card' },
    { act:'entitlementInfo', label:'Retrieve entitlements', ic:'list' },
    ...(cap('lifecycle') ? [
      { act:'suspendMembership', label:(state.pass?.status===2?'Reactivate':'Suspend'), ic:'toggle-off' }] : []),
  ]});
  if(cap('pricing')) groups.push({ title:'Pricing', ic:'coins', items:
    enabledModules().slice(0,4).map(m=>({ act:'prices', label:MODULES[m].label, ic:'coins', data:{mod:m} })) });
  if(cap('push')) groups.push({ title:'Push events', ic:'paper-plane', items:[
    { act:'resourceUpdate', label:'Resource update event', ic:'paper-plane' },
    { act:'eventRecovery', label:'Replay missed batch', ic:'refresh' },
  ]});

  wrap.innerHTML = `
    <div class="admin-head">
      ${icon('settings-sliders')}
      <div><b>Admin &amp; back-office</b>
        <span>Calls your server makes — not part of the app above.</span></div>
    </div>
    ${ctxActions.length ? `<div class="admin-grp ctx">
      <div class="ag-t">${icon('angle-small-right')} On this screen</div>
      <div class="ag-b">${ctxActions.map(btn).join('')}</div></div>` : ''}
    ${groups.filter(g=>g.items.length).map(g=>`<div class="admin-grp">
      <div class="ag-t">${icon(g.ic)} ${esc(g.title)}</div>
      <div class="ag-b">${g.items.map(btn).join('')}</div></div>`).join('')}
    ${!groups.length && !ctxActions.length
      ? `<div class="admin-empty">Turn on User management, Pricing or Push events to see back-office calls here.</div>`
      : ''}`;
  wrap.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>handleAct(el.dataset));
}

/* ----- toast ----- */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ----- dynamic QR ----- */
/* The QR is re-issued on a 60s TTL, not on every re-render — otherwise any
   unrelated state change would fire a fresh POST /v2/memberships/qrCodes. */
function manageQR(){
  const canvas=document.getElementById('qrCanvas');
  if(!canvas){
    clearInterval(state.qrTimer); state.qrTimer=null; state.qrScreenKey=null;
    return;
  }
  /* A canvas carrying data-qr is static (an id or voucher) — paint it and stop.
     Only the membership dynamic QR needs the refresh loop. */
  const fixed = canvas.getAttribute('data-qr');
  if(fixed){
    clearInterval(state.qrTimer); state.qrTimer=null; state.qrScreenKey=null;
    drawQR(canvas, fixed);
    return;
  }
  const key = 'card:'+(state.pass?.membershipId||'');
  if(state.qrScreenKey===key && state.qrTimer){
    if(state.lastQr) paintQR(canvas, state.lastQr);   // same card, just repaint
    return;
  }
  clearInterval(state.qrTimer);
  state.qrScreenKey=key;
  let secs=60;
  const draw=()=>{
    logCall(()=>API.dynamicQR()).then(body=>{
      const code = body?.data?.qrCode; if(!code) return;
      state.lastQr = code;
      const cv=document.getElementById('qrCanvas'); if(cv) paintQR(cv, code);
      secs=60; const c=document.getElementById('qrCount'); if(c) c.textContent='refreshes in 60s';
    });
  };
  draw();
  state.qrTimer=setInterval(()=>{
    secs--; const c=document.getElementById('qrCount');
    if(!c){ clearInterval(state.qrTimer); state.qrTimer=null; state.qrScreenKey=null; return; }
    c.textContent='refreshes in '+secs+'s';
    if(secs<=0) draw();
  },1000);
}
function paintQR(canvas, code){
  drawQR(canvas, code);
  const tk=document.getElementById('qrToken'); if(tk) tk.textContent='qrCode: '+code;
}
/* ============================================================================
   QR ENCODER — real, scannable, dependency-free.

   The UI Design Guidelines are explicit that the QR must contain ONLY the
   16-digit id or the dynamic string: "Including any additional text may cause
   verification to fail." A decorative placeholder would make that impossible to
   demonstrate, so this is a genuine encoder.

   Scope: byte mode, ECC level M, versions 1-6 (comfortably covers a 16-digit
   id, a voucher, or a dynamic QR string). Mask 0 with the correct format bits —
   scanners handle any valid mask, so we pick one rather than scoring all eight.
   ========================================================================== */
const QR = (()=>{
  /* GF(256) tables for Reed-Solomon, generated once. */
  const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
  for(let i=0,x=1;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11d; }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul=(a,b)=> (a===0||b===0)?0:EXP[LOG[a]+LOG[b]];

  function rsGenerator(n){
    let g=[1];
    for(let i=0;i<n;i++){
      const next=new Array(g.length+1).fill(0);
      for(let j=0;j<g.length;j++){ next[j]^=g[j]; next[j+1]^=mul(g[j],EXP[i]); }
      g=next;
    }
    return g;
  }
  function rsEncode(data,ecLen){
    const gen=rsGenerator(ecLen), res=new Array(ecLen).fill(0);
    for(const b of data){
      const factor=b^res[0];
      res.shift(); res.push(0);
      for(let i=0;i<ecLen;i++) res[i]^=mul(gen[i+1],factor);
    }
    return res;
  }

  /* Per-version, ECC-M: [total codewords, ec codewords per block, blocks] */
  const VER = {
    1:[26,10,1], 2:[44,16,1], 3:[70,26,1], 4:[100,18,2], 5:[134,24,2], 6:[172,16,4],
  };
  const ALIGN = { 1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30], 6:[6,34] };

  function pickVersion(len){
    for(const v of [1,2,3,4,5,6]){
      const [total,ec,blocks]=VER[v];
      const capacity=total-ec*blocks;
      const header=(v<10?2:3)+1;                 // count field + mode nibble
      if(capacity>=len+header) return v;
    }
    throw new Error('QR: payload too long for this encoder');
  }

  function bitStream(text, version){
    const bytes=[...new TextEncoder().encode(text)];
    const [total,ec,blocks]=VER[version];
    const capacity=total-ec*blocks;
    const bits=[];
    const push=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
    push(0b0100,4);                              // byte mode
    push(bytes.length, version<10?8:16);
    bytes.forEach(b=>push(b,8));
    const cap=capacity*8;
    for(let i=0;i<4 && bits.length<cap;i++) bits.push(0);   // terminator
    while(bits.length%8) bits.push(0);
    const words=[];
    for(let i=0;i<bits.length;i+=8) words.push(parseInt(bits.slice(i,i+8).join(''),2));
    const PAD=[0xEC,0x11];
    for(let i=0;words.length<capacity;i++) words.push(PAD[i%2]);
    return words;
  }

  function interleave(words, version){
    const [total,ec,blocks]=VER[version];
    const dataLen=total-ec*blocks;
    const per=Math.floor(dataLen/blocks), extra=dataLen%blocks;
    const dataBlocks=[], ecBlocks=[];
    let p=0;
    for(let b=0;b<blocks;b++){
      const n=per+(b>=blocks-extra?1:0);
      const chunk=words.slice(p,p+n); p+=n;
      dataBlocks.push(chunk); ecBlocks.push(rsEncode(chunk,ec));
    }
    const out=[];
    const maxData=Math.max(...dataBlocks.map(b=>b.length));
    for(let i=0;i<maxData;i++) dataBlocks.forEach(b=>{ if(i<b.length) out.push(b[i]); });
    for(let i=0;i<ec;i++) ecBlocks.forEach(b=>out.push(b[i]));
    return out;
  }

  /* Build the module matrix. null = free, 0/1 = set, 2/3 = reserved function. */
  function matrix(words, version){
    const size=version*4+17;
    const m=Array.from({length:size},()=>new Array(size).fill(null));
    const setF=(x,y,v)=>{ if(x>=0&&y>=0&&x<size&&y<size) m[y][x]=v?3:2; };

    const finder=(ox,oy)=>{
      for(let y=-1;y<=7;y++) for(let x=-1;x<=7;x++){
        const on = x>=0&&x<7&&y>=0&&y<7 &&
          (x===0||x===6||y===0||y===6 || (x>=2&&x<=4&&y>=2&&y<=4));
        setF(ox+x,oy+y,on);
      }
    };
    finder(0,0); finder(size-7,0); finder(0,size-7);

    for(let i=8;i<size-8;i++){ setF(i,6,i%2===0); setF(6,i,i%2===0); }

    for(const ax of ALIGN[version]) for(const ay of ALIGN[version]){
      if((ax<9&&ay<9)||(ax<9&&ay>size-10)||(ax>size-10&&ay<9)) continue;
      for(let y=-2;y<=2;y++) for(let x=-2;x<=2;x++)
        setF(ax+x,ay+y, Math.max(Math.abs(x),Math.abs(y))!==1);
    }
    setF(8,size-8,true);                                  // dark module
    for(let i=0;i<9;i++){ if(m[8][i]===null) setF(i,8,false); if(m[i][8]===null) setF(8,i,false); }
    for(let i=0;i<8;i++){ if(m[8][size-1-i]===null) setF(size-1-i,8,false);
                          if(m[size-1-i][8]===null) setF(8,size-1-i,false); }

    /* Zig-zag placement, mask 0 ((row+col)%2===0) applied as we write. */
    let bitIdx=0;
    const bitAt=i=> (i>>3)<words.length ? (words[i>>3]>>(7-(i&7)))&1 : 0;
    for(let right=size-1; right>0; right-=2){
      if(right===6) right=5;                              // skip the timing column
      for(let vert=0; vert<size; vert++){
        for(let j=0;j<2;j++){
          const x=right-j;
          const upward=((right+1)&2)===0;
          const y=upward? size-1-vert : vert;
          if(m[y][x]!==null) continue;
          let dark=bitAt(bitIdx++)===1;
          if(((y+x)%2)===0) dark=!dark;                   // mask 0
          m[y][x]=dark?1:0;
        }
      }
    }

    /* Format info: ECC M (01) + mask 0 -> BCH-encoded, XORed with 0x5412. */
    const fmt=(()=>{
      let v=(0b01<<3)|0;                                  // ECC M, mask 0
      let d=v<<10;
      for(let i=4;i>=0;i--) if(d&(1<<(i+10))) d^=0x537<<i;
      return ((v<<10)|d)^0x5412;
    })();
    const put=(x,y,bit)=>{ m[y][x]=bit?1:0; };
    for(let i=0;i<15;i++){
      const bit=(fmt>>i)&1;
      if(i<6) put(8,i,bit); else if(i<8) put(8,i+1,bit); else if(i===8) put(7,8,bit);
      else put(14-i,8,bit);
      if(i<8) put(size-1-i,8,bit); else put(8,size-15+i,bit);
    }
    /* Normalise the reserved markers back to plain 0/1. */
    for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(m[y][x]>1) m[y][x]-=2;
    return m;
  }

  return {
    /** text -> 2-D array of 0/1 modules. */
    encode(text){
      const v=pickVersion(new TextEncoder().encode(text).length);
      return matrix(interleave(bitStream(text,v),v), v);
    }
  };
})();

/* Paint an encoded QR onto a canvas, with the quiet zone the spec requires. */
function drawQR(canvas, text){
  const ctx=canvas.getContext('2d');
  const size=canvas.width;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  let m;
  try{ m=QR.encode(String(text)); }
  catch(e){ return; }
  const n=m.length, quiet=4, cell=Math.floor(size/(n+quiet*2));
  const off=Math.floor((size-cell*n)/2);
  ctx.fillStyle='#0A2333';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++)
    if(m[y][x]) ctx.fillRect(off+x*cell, off+y*cell, cell, cell);
}

  const next=b.dataset.mode;
  if(next===state.mode) return;
  state.mode=next;
  document.getElementById('modeSwitch').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  /* A mock token is meaningless against the real API and vice versa. */
  state.token=null; state.conn.status='idle';
  state.conn.message = next==='live'
    ? 'Live mode. Enter your sandbox credentials, then Connect.'
    : '';
  renderAll();
});
document.getElementById('langSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  state.lang=b.dataset.lang;
  document.getElementById('langSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});

  document.getElementById('log').innerHTML='<div class="console-empty">Cleared. Tap in the app to make new calls.</div>';

};

}
