<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DragonPass · API Integration Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0A2333;        /* Midnight Blue */
    --coral:#FA4A3D;      /* Coral Red */
    --coral-dim:#fde6e3;
    --canvas:#EEF1F5;
    --panel:#FFFFFF;
    --slate:#5B6B7B;
    --hair:#E1E6EC;
    --hair-2:#cfd6df;
    --good:#1FA971;
    --good-dim:#e4f4ed;
    --warn:#C77700;
    --console:#0B1726;
    --console-2:#11233a;
    --console-line:#1d3245;
    --code-ink:#cdd9e5;
    --code-dim:#7e93a8;
    --radius:14px;
    --radius-s:9px;
    --font:'Cabin',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--ink);background:var(--canvas);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
  }
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  .console ::-webkit-scrollbar-thumb{background:#2a3f57;background-clip:content-box}

  /* ---------- Top bar ---------- */
  .topbar{
    height:54px;display:flex;align-items:center;gap:16px;padding:0 18px;
    background:var(--ink);color:#fff;position:sticky;top:0;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  .brand .mark{display:grid;place-items:center;flex:0 0 auto}
  .brand .mark svg{width:26px;height:24px;display:block}
  .brand small{font-weight:500;color:#9fb1c2;font-size:11px;display:block;margin-top:-3px;letter-spacing:.3px}
  .topbar .spacer{flex:1}
  .env-tag{
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9fb1c2;
    background:#102c44;padding:6px 11px;border-radius:8px
  }

  /* ---------- Layout ---------- */
  .grid{
    display:grid;grid-template-columns:300px 1fr 460px;
    height:calc(100vh - 54px);min-height:0;
  }
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.left{background:var(--panel);border-right:1px solid var(--hair)}
  .col.center{background:var(--canvas)}
  .col.right{background:var(--console);border-left:1px solid #08111d}
  .col-head{
    padding:13px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px;
    flex:0 0 auto;
  }
  .col-head .eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:700}
  .col-head h2{margin:0;font-size:14px;font-weight:700}
  .col-head .sub{font-size:11.5px;color:var(--slate);margin-top:1px}
  .col-scroll{overflow:auto;flex:1;min-height:0}

  /* ---------- Left rail ---------- */
  .section{padding:14px 16px;border-bottom:1px solid var(--hair)}
  .section .label{
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);
    font-weight:700;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between
  }
  .seg{display:flex;background:var(--canvas);border-radius:9px;padding:3px;gap:3px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--slate);padding:7px 6px;border-radius:6px;
    font-size:12.5px;font-weight:600
  }
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(10,35,51,.12)}

  .preset{
    width:100%;text-align:left;border:1px solid var(--hair);background:#fff;border-radius:10px;
    padding:9px 11px;margin-bottom:7px;display:flex;gap:9px;align-items:flex-start;transition:.12s
  }
  .preset:hover{border-color:var(--coral);background:var(--coral-dim)}
  .preset .pi{font-size:16px;line-height:1.1}
  .preset b{font-size:13px;display:block}
  .preset span{font-size:11px;color:var(--slate)}

  .toggle{
    display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;user-select:none
  }
  .toggle:hover{background:var(--canvas)}
  .toggle .tg-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;background:var(--canvas);flex:0 0 auto}
  .toggle .tg-tx{flex:1;min-width:0}
  .toggle .tg-tx b{font-size:13px;font-weight:600;display:block;line-height:1.2}
  .toggle .tg-tx span{font-size:10.5px;color:var(--slate)}
  .switch{width:38px;height:22px;border-radius:20px;background:var(--hair-2);position:relative;flex:0 0 auto;transition:.16s}
  .switch::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .toggle.on .switch{background:var(--coral)}
  .toggle.on .switch::after{left:18px}
  .toggle.disabled{opacity:.4;pointer-events:none}

  .hint{font-size:11px;color:var(--slate);margin-top:4px;line-height:1.4}

  /* ---------- Center / phone ---------- */
  .center-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 16px 30px;gap:14px}
  /* ---------- Guided recipe checklist (above the phone) ---------- */
  .recipe-bar{
    width:100%;max-width:560px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:11px 14px
  }
  .rc-idle{font-size:11.5px;color:var(--slate);display:flex;align-items:center;gap:8px;line-height:1.45}
  .rc-idle .ic{font-size:13px;color:var(--hair-2);flex:0 0 auto}
  .rc-head{display:flex;align-items:flex-start;gap:10px}
  .rc-ic{width:28px;height:28px;border-radius:8px;background:var(--coral-dim);color:var(--coral);
    display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .rc-t{flex:1;min-width:0}
  .rc-t b{font-size:13px;display:block;line-height:1.2}
  .rc-t span{font-size:11px;color:var(--slate);display:block;margin-top:1px;line-height:1.4}
  .rc-count{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--slate);
    background:var(--canvas);padding:3px 8px;border-radius:20px;flex:0 0 auto}
  .rc-count.ok{background:var(--good-dim);color:var(--good)}
  .rc-x{border:0;background:transparent;color:var(--hair-2);font-size:12px;padding:2px 0 0;flex:0 0 auto}
  .rc-x:hover{color:var(--coral)}
  .rc-steps{list-style:none;margin:10px 0 0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
  .rc-steps li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--slate);
    background:var(--canvas);border-radius:20px;padding:3px 9px 3px 4px}
  .rc-steps li .rc-dot{width:16px;height:16px;border-radius:50%;background:#fff;color:var(--slate);
    display:grid;place-items:center;font-size:9px;font-weight:700;font-family:var(--mono);flex:0 0 auto}
  .rc-steps li.done{background:var(--good-dim);color:var(--good)}
  .rc-steps li.done .rc-dot{background:var(--good);color:#fff;font-size:8px}
  .rc-steps li.next{background:var(--ink);color:#fff}
  .rc-steps li.next .rc-dot{background:rgba(255,255,255,.22);color:#fff}
  .rc-hint{margin-top:8px;font-size:11px;color:var(--slate);display:flex;align-items:center;gap:6px;line-height:1.4}
  .rc-hint.ok{color:var(--good)}
  .rc-hint .ic{font-size:11px;flex:0 0 auto}

  .phone{
    width:340px;background:#000;border-radius:38px;padding:11px;box-shadow:0 20px 50px -18px rgba(10,35,51,.55);
    flex:0 0 auto
  }
  .screen{
    background:#fff;border-radius:28px;height:680px;overflow:hidden;display:flex;flex-direction:column;position:relative
  }
  .statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:600;color:var(--ink);flex:0 0 auto}
  .statusbar .dots{display:flex;gap:3px;align-items:center}
  .statusbar .dots i{width:4px;height:4px;background:var(--ink);border-radius:50%;display:block}
  .app-head{
    padding:8px 18px 12px;flex:0 0 auto;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair)
  }
  .app-head .logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .app-head .ti{flex:1;min-width:0}
  .app-head .ti b{font-size:14px;display:block;line-height:1.1}
  .app-head .ti span{font-size:11px;color:var(--slate)}
  .app-head .back{border:0;background:var(--canvas);width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--ink)}

  .app-body{flex:1;overflow:auto;padding:14px 16px 16px}
  .app-tabs{
    flex:0 0 auto;border-top:1px solid var(--hair);display:flex;padding:7px 6px 9px;background:#fff
  }
  .app-tabs button{
    flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10px;color:var(--slate);font-weight:600;padding:3px 0
  }
  .app-tabs button .ic{font-size:17px}
  .app-tabs button.on{color:var(--coral)}

  .searchbar{display:flex;align-items:center;gap:8px;background:var(--canvas);border-radius:11px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--slate)}
  .loc-chip{display:inline-flex;align-items:center;gap:5px;background:var(--coral-dim);color:var(--coral);font-weight:600;font-size:11.5px;padding:4px 10px;border-radius:20px;margin-bottom:12px}

  .sec-title{font-size:12px;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between}
  .sec-title span{font-size:11px;color:var(--slate);font-weight:600}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{
    border:1px solid var(--hair);border-radius:13px;padding:13px;cursor:pointer;transition:.12s;background:#fff;text-align:left
  }
  .tile:hover{border-color:var(--coral);transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(10,35,51,.4)}
  .tile .em{font-size:22px}
  .tile b{display:block;font-size:13px;margin-top:7px}
  .tile span{font-size:11px;color:var(--slate)}

  .card-res{border:1px solid var(--hair);border-radius:13px;overflow:hidden;margin-bottom:11px;background:#fff;cursor:pointer;transition:.12s}
  .card-res:hover{border-color:var(--coral);box-shadow:0 6px 16px -10px rgba(10,35,51,.4)}
  .card-res .ph{height:88px;background:linear-gradient(120deg,#13314a,#0A2333);position:relative;color:#fff;display:flex;align-items:flex-end;padding:9px 12px}
  .card-res .ph .em{position:absolute;top:10px;right:12px;font-size:22px;opacity:.85}
  .card-res .ph b{font-size:14px}
  .card-res .meta{padding:9px 12px;display:flex;align-items:center;justify-content:space-between}
  .card-res .meta .sub{font-size:11px;color:var(--slate)}
  .pricepill{background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px}

  .btn{
    width:100%;border:0;background:var(--coral);color:#fff;font-weight:700;font-size:14px;
    padding:13px;border-radius:12px;margin-top:10px;transition:.12s
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--hair)}
  .btn.ink{background:var(--ink)}
  .btn:disabled{background:var(--hair-2);cursor:not-allowed}

  .field{margin-bottom:11px}
  .field label{font-size:11px;font-weight:600;color:var(--slate);display:block;margin-bottom:4px}
  .field .ctrl{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font-size:13px}
  .field .ctrl button{border:0;background:var(--canvas);width:26px;height:26px;border-radius:7px;font-size:15px;font-weight:700;color:var(--ink)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips button{border:1px solid var(--hair);background:#fff;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .chips button.on{border-color:var(--coral);background:var(--coral-dim);color:var(--coral)}

  .passcard{
    border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#13314a 0%,#0A2333 100%);box-shadow:0 14px 30px -16px rgba(10,35,51,.7)
  }
  .passcard.member{background:linear-gradient(135deg,#FA4A3D 0%,#c5281d 100%)}
  .passcard .pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
  .passcard .pc-top .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
  .passcard .pc-top b{font-size:16px;display:block;margin-top:2px}
  .passcard .tier{font-size:11px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;font-weight:600}
  .passcard .pc-no{font-family:var(--mono);font-size:13px;letter-spacing:1px;opacity:.92}
  .passcard .pc-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-size:11px;opacity:.85}
  .qrbox{background:#fff;border-radius:14px;padding:14px;margin-top:14px;text-align:center}
  .qr{width:150px;height:150px;margin:0 auto;image-rendering:pixelated}
  .qr-meta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:8px}
  .qr-count{font-size:11px;color:var(--coral);font-weight:600;margin-top:2px}

  .entrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}
  .entrow .ei{width:30px;height:30px;border-radius:8px;background:var(--canvas);display:grid;place-items:center;font-size:15px}
  .entrow .et{flex:1}
  .entrow .et b{font-size:12.5px;display:block}
  .entrow .et span{font-size:10.5px;color:var(--slate)}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
  .badge.ok{background:var(--good-dim);color:var(--good)}
  .badge.used{background:var(--canvas);color:var(--slate)}
  .badge.pend{background:#fff3e0;color:var(--warn)}

  .empty{text-align:center;color:var(--slate);padding:40px 20px;font-size:12.5px}
  .empty .em{font-size:32px;display:block;margin-bottom:8px;opacity:.6}

  .toast{
    position:absolute;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:#fff;
    font-size:12px;font-weight:600;padding:9px 15px;border-radius:11px;opacity:0;transition:.25s;pointer-events:none;z-index:5;
    max-width:80%;text-align:center
  }
  .toast.show{opacity:1;bottom:88px}

  /* ---------- Right console ---------- */
  .console{font-family:var(--mono)}
  .console .col-head{border-bottom:1px solid #08111d}
  .console .col-head .eyebrow,.console .col-head h2{color:#cdd9e5}
  .console .col-head .sub{color:#6f86a0}
  .console-toolbar{display:flex;gap:7px;padding:9px 14px;border-bottom:1px solid #0d1d30;flex:0 0 auto;align-items:center}
  .lang-seg{display:flex;background:#0d1d30;border-radius:7px;padding:2px}
  .lang-seg button{border:0;background:transparent;color:#6f86a0;padding:4px 9px;border-radius:5px;font-size:11px;font-weight:600;font-family:var(--mono)}
  .lang-seg button.on{background:#20364f;color:#fff}
  .console-toolbar .sp{flex:1}
  .clearbtn{border:1px solid #24405c;background:transparent;color:#8aa0b8;border-radius:7px;padding:5px 10px;font-size:11px;font-family:var(--mono)}
  .clearbtn:hover{border-color:var(--coral);color:#fff}

  .log{padding:10px 12px;flex:1;overflow:auto;min-height:0}
  .call{border:1px solid #16283d;border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--console-2);animation:slidein .22s ease}
  @keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .call-head{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer}
  .verb{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em}
  .verb.GET{background:#13354f;color:#5fb3f0}
  .verb.POST{background:#143b2c;color:#52c98d}
  .verb.PUT{background:#3a3315;color:#d9b94a}
  .verb.DELETE{background:#3d1f1c;color:#f0786b}
  .verb.EVENT{background:#2c2342;color:#b08ef0}
  .call-head .path{flex:1;color:#cdd9e5;font-size:11.5px;word-break:break-all}
  .call-head .status{font-size:10px;font-weight:700;color:#52c98d}
  .call-head .status.err{color:#f0786b}
  .call-head .chev{color:#5b748e;font-size:11px;transition:.15s}
  .vtag{font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:.02em;white-space:nowrap}
  .vtag.ok{background:#143b2c;color:#52c98d}
  .vtag.rep{background:#3a3315;color:#d9b94a}
  .cross-banner{background:var(--coral-dim);color:var(--coral);font-size:11.5px;font-weight:600;padding:8px 11px;border-radius:10px;margin-bottom:12px}
  .call.collapsed .chev{transform:rotate(-90deg)}
  .call.collapsed .call-body{display:none}
  .call-body{border-top:1px solid #16283d;padding:10px 11px}
  .blk{margin-bottom:9px}
  .blk:last-child{margin-bottom:0}
  .blk .bt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#5b748e;font-weight:700;margin-bottom:4px}
  pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--code-ink);white-space:pre-wrap;word-break:break-word}
  pre .k{color:#7fb0e0}
  pre .s{color:#86d29a}
  pre .n{color:#e0a96d}
  pre .c{color:#5b748e}

  .console-empty{color:#5b748e;text-align:center;padding:50px 20px;font-size:12px;line-height:1.6}
  .console-empty .em{font-size:30px;display:block;margin-bottom:10px;opacity:.6}

  /* ---------- Live mode / connection ---------- */
  .mode-switch{display:flex;background:#102c44;border-radius:8px;padding:3px;gap:2px}
  .mode-switch button{border:0;background:transparent;color:#9fb1c2;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600}
  .mode-switch button.on{background:#1FA971;color:#fff}
  .mode-switch button.on[data-mode="mock"]{background:#33506e}
  .verb.PATCH{background:#2c3a1a;color:#a8c94a}
  .call-head .ms{font-size:9.5px;color:#5b748e;font-family:var(--mono);white-space:nowrap}
  .srctag{font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:4px;white-space:nowrap}
  .srctag.live{background:#143b2c;color:#52c98d}
  .srctag.mock{background:#20364f;color:#8aa0b8}
  .call.pending{opacity:.72}
  .call.pending .status{color:#d9b94a}
  .call-err{background:#2a1614;border:1px solid #4d2723;color:#f0a79c;font-size:10.5px;padding:7px 9px;border-radius:8px;margin-bottom:8px;line-height:1.5}

  .conn-grid{display:grid;gap:8px}
  .inp{width:100%;border:1px solid var(--hair);border-radius:9px;padding:8px 10px;font-size:12px;
       font-family:var(--mono);color:var(--ink);background:#fff;outline:none}
  .inp:focus{border-color:var(--coral)}
  .inp::placeholder{color:#9aa8b6}
  .lbl-s{font-size:10.5px;font-weight:700;color:var(--slate);display:block;margin-bottom:3px;letter-spacing:.02em}
  .conn-state{font-size:11px;font-weight:600;padding:7px 9px;border-radius:8px;line-height:1.45}
  .conn-state.ok{background:var(--good-dim);color:var(--good)}
  .conn-state.bad{background:#fdecea;color:#c0392b}
  .conn-state.idle{background:var(--canvas);color:var(--slate)}
  .btn-s{border:0;background:var(--ink);color:#fff;font-weight:700;font-size:12px;padding:9px;border-radius:9px;width:100%}
  .btn-s.alt{background:#fff;color:var(--ink);border:1.5px solid var(--hair)}
  .btn-s:disabled{background:var(--hair-2);cursor:not-allowed}

  .voucher{border:1.5px dashed var(--coral);border-radius:13px;padding:14px;text-align:center;margin-bottom:11px;background:var(--coral-dim)}
  .voucher .vc{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--coral);letter-spacing:1.5px}
  .voucher .vl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700}
  .voucher a{font-size:11px;color:var(--ink);word-break:break-all}

<script>
/* ============================================================================
   DragonPass API Integration Playground  — single-file, dependency-free
   ----------------------------------------------------------------------------
   API contracts below are wired to the real DragonPass v2 developer portal
   (apifox.dragonpass.com / developer.dragonpass.com). Paths, header names,
   integer module codes, status/category enums and identity fields
   (ePassId / voucher / dpId / membershipId) match the published OpenAPI specs.

   TWO TRANSPORTS (state.mode):
     'mock' — canned, portal-accurate responses. No network. Default.
     'live' — your own credentials against the real sandbox, called directly
              from the browser (the sandbox is CORS-permissive — see LIVE
              TRANSPORT). Credentials live in memory only; nothing is persisted.

   ARCHITECTURE — config-driven so it stays expandable:
     MODULES / CAPABILITIES / SOLUTIONS / PRESETS / RECIPES / API / handleAct
   Every API.* builder returns { method, path, body?, response, flow, step,
   auth?, verified?, after?(data) }. after() receives the EFFECTIVE response
   data — the live payload in live mode — so state carries real ids.
   ========================================================================== */

/* ---------- DragonPass enums (from portal) ---------- */
const MODULE_CODE = { Lounge:1, FastTrack:2, SetMeal:3, DiningCoupon:4, DiningDiscount:5,
  DiningRestaurant:6, Fitness:7, eSIM:8, Transportation:9, Flights:10, LocalOffer:11, CrossModule:0 };
const MODULE_NAME = { 0:'Cross-Module',1:'Lounge',2:'Fast Track',3:'Set Meal',4:'Dining Coupon',
  5:'Dining Discount',6:'Dining Restaurant',7:'Fitness',8:'eSIM',9:'Transportation',10:'Flights',11:'Local Offer' };
const ORDER_STATUS = { 1:'Confirmed',2:'Used',3:'Cancelled',4:'Expired',5:'Pending',10:'Failed' };
const ORDER_CATEGORY = { 1:'Walk-in',2:'Prebooking',3:'Walk-in & Prebooking' };
const EPASS_STATUS = { 0:'Pending Activation',1:'Active',2:'Suspended',3:'Cancelled',9:'Expired' };
const MEMBERSHIP_STATUS = { 0:'Pending Activation',1:'Active',2:'Suspended',3:'Cancelled',8:'Replaced',9:'Expired' };
/* Local Offer marketingTag enum */
const MARKETING_TAG = { 1:'Buy X get Y', 2:'Discount', 3:'Value off', 4:'Set meal' };
/* Cross-Module E-pass supports ONLY these modules (per portal spec) */
const CROSS_MODULE_SET = [MODULE_CODE.Lounge, MODULE_CODE.SetMeal, MODULE_CODE.DiningCoupon]; // [1,3,4]
const PROGRAM_ID = '1876920048220766208';
/* Sandbox simulation slugs — only these four modules have simulation endpoints */
const SIM_SLUG = { 1:'lounges', 2:'fastTrack', 3:'setMeals', 4:'coupons' };
/* Fast Track is prebooking-only: it has no walk-in simulation endpoint */
const SIM_WALKIN = [1,3,4];

/* ---------- 1. CONFIG: MODULES ----------
   code = integer module; slug = {module} path segment; sample uses N##### resource ids */
/* `walkin` and `prebook` are the API's real per-module capabilities, not a
   product decision. Two independent sources in the portal agree:
     - which modules have a "Create …Prebooking Order" endpoint, and
     - which /v2/simulations/{module}/… variants exist.
   Fast Track has only a prebooking simulation (no walk-in); Set Meal and
   Coupon have only a walk-in simulation and no Create-Order endpoint. The UI
   reads these flags so the demo can never offer a journey the API can't do. */
const MODULES = {
  lounge:    { code:1, slug:'lounges',  label:'Lounge',     icon:'lounge', blurb:'Airport lounges',     price:'£24',
               cross:true,  walkin:true,  prebook:true,
               sample:[{id:'N00012',name:'Plaza Premium Lounge',loc:'Terminal 1 · Airside',sub:'Open 05:00–22:00'},
                       {id:'N02207',name:'Aspire Lounge',loc:'Terminal 5 · Airside',sub:'Showers · Bar'}] },
  fasttrack: { code:2, slug:'fastTrack',label:'Fast Track', icon:'fasttrack', blurb:'Skip the queue',   price:'£9',
               cross:false, walkin:false, prebook:true,
               sample:[{id:'N05510',name:'Security Fast Track',loc:'Terminal 5 · Landside',sub:'Avg wait 4 min'}] },
  setmeal:   { code:3, slug:'setMeals', label:'Set Meal',   icon:'setmeal', blurb:'Lounge alternative', price:'£18',
               cross:true,  walkin:true,  prebook:false,
               sample:[{id:'N08902',name:'Gordon Ramsay Plane Food',loc:'Terminal 5 · Airside',sub:'2-course set meal'}] },
  dining:    { code:4, slug:'coupons',  label:'Dining',     icon:'dining', blurb:'Fixed-value dining credit', price:'£15 coupon',
               cross:true,  walkin:true,  prebook:false,
               sample:[{id:'N08841',name:'Plane Food',loc:'Terminal 5 · Airside',sub:'£15 dining coupon'},
                       {id:'N08845',name:'The Curator Bar',loc:'Terminal 2 · Airside',sub:'£15 dining coupon'}] },
  fitness:   { code:7, slug:'fitness',  label:'Fitness',    icon:'fitness', blurb:'Gyms & wellness',    price:'from £10',
               cross:false, walkin:false, prebook:true, lifestyle:true, options:true, schedule:true,
               sample:[{id:'F00001',name:'DragonPass Fitness Club',loc:'Manchester',sub:'Pool · Sauna'}] },
  esim:      { code:8, slug:'esims',    label:'eSIM',       icon:'esim', blurb:'Travel data',           price:'from £6',
               cross:false, walkin:false, prebook:true, lifestyle:true, options:true, topup:true,
               sample:[{id:'E00001',name:'eSIM United Kingdom',loc:'United Kingdom',sub:'5G data plans'},
                       {id:'E00002',name:'eSIM Europe',loc:'33 countries',sub:'5G data plans'}] },
  localoffer:{ code:11, slug:'localOffers', label:'Local Offer', icon:'localoffer', blurb:'Merchant discounts', price:'free with pass',
               cross:false, walkin:false, prebook:true, lifestyle:true, options:true, offers:true,
               sample:[{id:'GR0006118',name:'The Malayan Council, Dunlop',loc:'Singapore',sub:'Dining · 5% off'},
                       {id:'GR0007204',name:'Kiehl’s Orchard Road',loc:'Singapore',sub:'Retail · Buy 2 get 1'}] },
};
/* Icon helpers — DP module glyphs come from the sprite, UI glyphs from UIcons. */
const mIcon = (mkey, cls)=> `<svg class="mi ${cls||''}" aria-hidden="true"><use href="#m-${MODULES[mkey]?MODULES[mkey].icon:'lounge'}"></use></svg>`;
const icon  = (name, cls)=> `<i class="ic ic-${name} ${cls||''}" aria-hidden="true"></i>`;
const slugToKey = (slug)=> Object.keys(MODULES).find(k=>MODULES[k].slug===slug);
const keyByCode = (code)=> Object.keys(MODULES).find(k=>MODULES[k].code===code);

/* ---------- 2. CONFIG: CAPABILITIES ---------- */
const CAPABILITIES = {
  search:    { label:'Search & discovery', ic:'search',           desc:'GET /v2/search/modules + resource lists' },
  prebooking:{ label:'Prebooking',         ic:'calendar',         desc:'Reserve a slot, redeem with a voucher' },
  walkin:    { label:'Walk-in redemption', ic:'ticket',           desc:'Show pass (ePassId / QR), redeem on arrival' },
  qr:        { label:'Dynamic QR',         ic:'qrcode',           desc:'POST /v2/memberships/qrCodes, 60s TTL' },
  user:      { label:'User management',    ic:'user',             desc:'Create / search / update / delete users' },
  lifecycle: { label:'Cancel & amend',     ic:'refresh',          desc:'PATCH /v2/orders, membership & user updates' },
  pricing:   { label:'Pricing queries',    ic:'coins',            desc:'POST /v2/resources/prices + options/prices' },
  push:      { label:'Push events',        ic:'paper-plane',      desc:'Webhooks, resource updates & event recovery' },
  sandbox:   { label:'Sandbox simulation', ic:'bolt',             desc:'POST /v2/simulations/.../redemptions' },
};

/* ---------- 3. CONFIG: SOLUTIONS ---------- */
const SOLUTIONS = {
  epass:      { label:'E-pass',     blurb:'Issue a redeemable pass (ePassId)' },
  membership: { label:'Membership', blurb:'Member tiers, entitlements & QR' },
};

/* ---------- 4. CONFIG: PRESETS ---------- */
const PRESETS = [
  { id:'card', ic:'credit-card', title:'Card issuer perk', desc:'Lounge + Fast Track as an E-pass benefit',
    apply:{ solution:'epass', cross:false, modules:['lounge','fasttrack'], caps:['search','walkin','prebooking','user','push'] } },

/* ============================================================================
   SHAREABLE PERMALINK
   Encodes the scenario — issuing model, modules, capabilities, recipe, persona,
   chosen hub — into the URL fragment so a colleague can open the exact same
   setup. Credentials are NEVER included: `serialise()` reads a fixed whitelist
   of keys, so nothing from state.conn can reach the URL even by accident.
   ========================================================================== */
const PERMALINK_KEYS = ['solution','cross','modules','caps','recipe','persona','hub','mode'];

function serialiseState(){
  const p = new URLSearchParams();
  p.set('s', state.solution);
  if(state.cross) p.set('x','1');
  p.set('m', enabledModules().join('.'));
  p.set('c', Object.keys(state.caps).filter(k=>state.caps[k]).join('.'));
  if(state.recipe) p.set('r', state.recipe);
  if(state.persona!=='jordan') p.set('p', state.persona);
  if(state.hubChosen) p.set('h', state.hub.id+'~'+state.hub.iata+'~'+state.hub.name);
  return p.toString();
}

function applySerialised(str){
  let p; try{ p=new URLSearchParams(str); }catch(e){ return false; }
  if(![...p.keys()].length) return false;
  if(p.get('s')==='epass'||p.get('s')==='membership') state.solution=p.get('s');
  state.cross = p.get('x')==='1';
  if(p.has('m')){
    const on=new Set(p.get('m').split('.').filter(Boolean));
    Object.keys(state.modules).forEach(k=>state.modules[k]=on.has(k));
  }
  if(p.has('c')){
    const on=new Set(p.get('c').split('.').filter(Boolean));
    Object.keys(state.caps).forEach(k=>state.caps[k]=on.has(k));
  }
  if(p.has('r') && RECIPES[p.get('r')]) state.recipe=p.get('r');
  if(p.has('p') && PERSONAS[p.get('p')]) state.persona=p.get('p');
  if(p.has('h')){
    const [id,iata,...rest]=p.get('h').split('~');
    if(id){ state.hub={ ...state.hub, id, iata:iata||'', name:rest.join('~')||id }; state.hubChosen=true; }
  }
  return true;
}

let _permaTimer;
function syncPermalink(){
  if(typeof history==='undefined' || !history.replaceState) return;
  clearTimeout(_permaTimer);
  _permaTimer=setTimeout(()=>{

  },250);
}

function permalinkUrl(){
  const base = (typeof location!=='undefined' ? location.href.split('#')[0] : '');
  return base+'#'+serialiseState();
}

/* ============================================================================
   CLIPBOARD
   navigator.clipboard needs a secure context, which file:// is not, so fall
   back to a hidden textarea + execCommand.
   ========================================================================== */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

/* ============================================================================
   LIVE TRANSPORT
   The browser calls the sandbox directly — no proxy, no server.

   The sandbox's Kong gateway is CORS-permissive; verified against the live host:

     OPTIONS /api/v2/auth/token  ->  200
       Access-Control-Allow-Origin:  *
       Access-Control-Allow-Headers: *
       Access-Control-Allow-Methods: GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS,...

   The wildcard is valid for us because the token travels in an Authorization
   header rather than a cookie — we never set credentials:'include', which is
   the only thing `*` would refuse. Verified working cross-origin from a served
   origin, so any static host (localhost, GitHub Pages, …) works.

   Don't reintroduce a forwarder without re-measuring; an earlier version of
   this tool shipped one on the mistaken assumption that CORS was blocked.
   ========================================================================== */
function liveHeaders(call){
  const h = { 'X-Program-ID': programId() };
  if(call.method!=='GET') h['X-Request-ID'] = uuid();
  if(call.auth!==false)   h['Authorization'] = 'Bearer ' + (state.token||'');
  if(call.body && call.method!=='GET') h['Content-Type'] = 'application/json';
  return h;
}

/* Returns { status, body, ms, error } — never throws. */
async function sendLive(call){
  const t0 = Date.now();
  const base = liveBase();
  if(!base) return { status:0, body:null, ms:0, error:'No base URL set. Open Connection in the left rail.' };
  const url = base + call.path;
  const headers = liveHeaders(call);
  const hasBody = !!(call.body && call.method!=='GET');
  try{
    const r = await fetch(url, { method:call.method, headers, body: hasBody?JSON.stringify(call.body):undefined });
    const text = await r.text();
    let body=null; try{ body = text?JSON.parse(text):null; }catch(e){ body = { raw:text }; }
    return { status:r.status, body, ms:Date.now()-t0 };
  }catch(e){
    /* Report what happened without guessing why — the usual causes are a
       mistyped base URL, no connectivity, or a network that blocks the host. */
    return { status:0, body:null, ms:Date.now()-t0,
      error:'Could not reach '+url+' — '+(e && e.message || e)+
            '. Check the base URL and your connection.' };
  }
}

/* ---- guided recipes: tick a step when its endpoint is reached ---- */
function recipeSteps(){ return (RECIPES[state.recipe]||{}).steps || []; }
function advanceRecipe(call){
  if(!state.recipe) return;
  const done = state.recipeProgress[state.recipe] || (state.recipeProgress[state.recipe]=new Set());
  const probe = call.method==='EVENT' ? (call.response?.eventType||'') : call.path;
  let hit=false;
  recipeSteps().forEach((s,i)=>{ if(!s.client && s.match && probe.includes(s.match) && !done.has(i)){ done.add(i); hit=true; } });
  if(hit) renderRecipeBar();
}
/* Mark a step the integrator fulfils themselves rather than by calling the API. */
function markRecipeStep(recipeId, index){
  if(state.recipe!==recipeId) return;
  const done = state.recipeProgress[recipeId] || (state.recipeProgress[recipeId]=new Set());
  done.add(index); renderRecipeBar();
}

/* ============================================================================
   CONSOLE — log a call, render request/response + language snippet
   ========================================================================== */
/* Calls are serialised through one promise chain so that a builder always sees
   the state written by the call before it — which matters in live mode, where
   an ePassId only exists once the real response has come back.
   logCall() accepts either a call object or a thunk returning one; pass a thunk
   whenever the request depends on state an earlier call will set.
   Returns a promise resolving to the EFFECTIVE response body. */
let _callChain = Promise.resolve();
function logCall(input){
  const p = _callChain.then(()=>execCall(input));
  _callChain = p.then(()=>{}, ()=>{});
  return p;
}

async function execCall(input){
  const call = (typeof input==='function') ? input() : input;

  // auto-authenticate like a real SDK — run inline, not through the queue.
  // In live mode with a pasted token there is nothing to fetch, so don't send
  // an empty credential pair to the real API.
  const canAutoAuth = !(state.mode==='live' && state.conn.authMode==='token');
  if(call.auth!==false && !state.token && call.path!=='/v2/auth/token' && canAutoAuth){
    await execCall(API.token());
  }

  const live = state.mode==='live' && call.method!=='EVENT';
  const el = renderCall(call, live);

  let body = call.response, http = 200, ms = 0, error = null;
  if(live){
    const res = await sendLive(call);
    http = res.status; ms = res.ms; error = res.error || null;
    body = res.body != null ? res.body : call.response;
    if(error) body = res.body || null;
  }

  const succeeded = call.method==='EVENT' || (!error && (body==null || body.code===0));
  if(succeeded && typeof call.after==='function'){
    try{ call.after(body && body.data); }catch(e){ /* a malformed live payload must not break the UI */ }
  }

  patchCall(el, call, { live, body, http, ms, error, succeeded });
  if(succeeded) advanceRecipe(call);
  return body;
}

/* Render the card immediately; in live mode it starts in a pending state and is
   patched when the real response lands. */
function renderCall(call, live){
  const log = document.getElementById('log');
  if(log.querySelector('.console-empty')) log.innerHTML='';
  const el = document.createElement('div');
  el.className = 'call' + (live?' pending':'');
  const vbadge = call.verified===false
    ? '<span class="vtag rep" title="Representative shape — schema not individually verified">≈ shape</span>'
    : '<span class="vtag ok" title="Field names verified against the developer portal">✓ schema</span>';
  const src = call.method==='EVENT' ? '' :
    `<span class="srctag ${live?'live':'mock'}">${live?'live':'mock'}</span>`;
  el.innerHTML = `
    <div class="call-head">
      <span class="verb ${call.method}">${call.method}</span>
      <span class="path">${esc(call.path)}</span>
      ${vbadge}${src}
      <span class="ms"></span>
      <span class="status">${live?'…':''}</span>
      <span class="chev">▾</span>
    </div>
    <div class="call-body">
      ${call.method!=='EVENT' ? `<div class="blk"><div class="bt">Request
        <button class="cpy" data-cpy="req" title="Copy request">${icon('copy')}</button></div>${snippet(call)}</div>`:''}
      <div class="blk resblk"><div class="bt">${call.method==='EVENT'?'Event payload (sent to your webhook)':'Response'}
        <button class="cpy" data-cpy="res" title="Copy response">${icon('copy')}</button></div>
        <pre>${live?'<span class="c">waiting for the sandbox…</span>':hl(call.response)}</pre></div>
    </div>`;
  el.querySelector('.call-head').addEventListener('click',()=>el.classList.toggle('collapsed'));
  el.querySelectorAll('[data-cpy]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const which=b.dataset.cpy;
    const text = which==='req' ? snippetText(call)
      : (el.querySelector('.resblk pre')?.textContent || '');
    copyText(text).then(ok=>{
      b.classList.add(ok?'done':'fail');
      setTimeout(()=>b.classList.remove('done','fail'),1200);
    });
  });
  if(call.method!=='EVENT') state.exported.push(call);
  log.prepend(el);
  [...log.querySelectorAll('.call')].slice(3).forEach(c=>c.classList.add('collapsed'));
  return el;
}

function patchCall(el, call, r){
  el.classList.remove('pending');
  const st = el.querySelector('.status');
  const msEl = el.querySelector('.ms');
  if(call.method==='EVENT'){ st.textContent='webhook'; }
  else if(r.error){ st.textContent='failed'; st.classList.add('err'); }
  else {
    const codeTxt = r.body && typeof r.body.code!=='undefined' ? ' · code '+r.body.code : '';
    st.textContent = r.http + codeTxt;
    st.classList.toggle('err', !r.succeeded);
  }
  if(r.live && r.ms) msEl.textContent = r.ms+'ms';

  const blk = el.querySelector('.resblk');
  const errHtml = r.error ? `<div class="call-err">${esc(r.error)}</div>` : '';
  const pre = r.body==null ? '<span class="c">no response body</span>' : hl(r.body);
  blk.innerHTML = `<div class="bt">${call.method==='EVENT'?'Event payload (sent to your webhook)':'Response'}</div>${errHtml}<pre>${pre}</pre>`;
}

/* language-specific request snippet, with real DragonPass headers */
function snippet(call){
  if(call.method==='EVENT') return '';
  const url = baseUrl()+call.path.split('?')[0];
  const qs  = call.path.includes('?')?('?'+call.path.split('?')[1]):'';
  const hasBody = call.body && call.method!=='GET';
  const authH = call.auth===false ? '' : 'Bearer '+(state.token? state.token.slice(0,18)+'…' : '<token>');
  const headers = [];
  headers.push(['X-Program-ID', programId()]);
  if(call.method!=='GET') headers.push(['X-Request-ID', uuid()]);
  if(call.auth!==false)   headers.push(['Authorization', authH]);
  if(hasBody)             headers.push(['Content-Type','application/json']);
  /* Never echo a real client secret into a copyable snippet. */
  const bodyJson = hasBody ? JSON.stringify(
    call.secretBody ? { ...call.body, secret:'<your-client-secret>' } : call.body) : '';

  if(state.lang==='curl'){
    let s = `curl -X ${call.method} "${url}${qs}"`;
    headers.forEach(([k,v])=> s+=` \\\n  -H "${k}: ${v}"`);
    if(hasBody) s+=` \\\n  -d '${bodyJson}'`;
    return `<pre>${hlText(s)}</pre>`;
  }
  if(state.lang==='js'){
    let s = `await fetch("${url}${qs}", {\n  method: "${call.method}",\n  headers: {\n`;
    s += headers.map(([k,v])=>`    "${k}": "${v}"`).join(',\n');
    s += `\n  }${hasBody?',\n  body: JSON.stringify('+bodyJson+')':''}\n});`;
    return `<pre>${hlText(s)}</pre>`;
  }
  if(state.lang==='python'){
    let s = `import requests\n\nr = requests.${call.method.toLowerCase()}(\n    "${url}${qs}",\n    headers={\n`;
    s += headers.map(([k,v])=>`        "${k}": "${v}"`).join(',\n');
    s += `\n    }${hasBody?',\n    json='+bodyJson:''}\n)\nr.raise_for_status()\nprint(r.json())`;
    return `<pre>${hlText(s)}</pre>`;
  }
  if(state.lang==='csharp'){
    let s = `using var client = new HttpClient();\nvar req = new HttpRequestMessage(HttpMethod.${
      call.method.charAt(0)+call.method.slice(1).toLowerCase()}, "${url}${qs}");\n`;
    headers.filter(([k])=>k!=='Content-Type').forEach(([k,v])=> s+=`req.Headers.Add("${k}", "${v}");\n`);
    if(hasBody) s+=`req.Content = new StringContent(\n    ${JSON.stringify(bodyJson)},\n    Encoding.UTF8, "application/json");\n`;
    s+=`var res = await client.SendAsync(req);\nres.EnsureSuccessStatusCode();`;
    return `<pre>${hlText(s)}</pre>`;
  }
  // java (OkHttp)
  let s = `Request req = new Request.Builder()\n  .url("${url}${qs}")\n`;
  headers.forEach(([k,v])=> s+=`  .header("${k}", "${v}")\n`);
  if(hasBody) s+=`  .${call.method.toLowerCase()}(RequestBody.create(\n    "${bodyJson.replace(/"/g,'\\"')}",\n    MediaType.parse("application/json")))\n`;
  else s+=`  .${call.method.toLowerCase()}()\n`;
  s+=`  .build();`;
  return `<pre>${hlText(s)}</pre>`;
}

/* Plain-text version of the same request, for copy-to-clipboard. */
function snippetText(call){
  const div=document.createElement('div');
  div.innerHTML=snippet(call);
  return div.textContent||'';
}

/* ============================================================================
   POSTMAN EXPORT
   Serialises the calls logged this session into a v2.1 collection. Secrets are
   redacted exactly as in the on-screen snippets, and the token becomes a
   collection variable rather than a baked-in literal.
   ========================================================================== */
function postmanCollection(){
  const items = state.exported.filter(c=>c.method!=='EVENT').map(c=>{
    const [pathPart, query] = c.path.split('?');
    const hdrs = [{key:'X-Program-ID', value:programId()}];
    if(c.method!=='GET') hdrs.push({key:'X-Request-ID', value:'{{$guid}}'});
    if(c.auth!==false)   hdrs.push({key:'Authorization', value:'Bearer {{accessToken}}'});
    const hasBody = !!(c.body && c.method!=='GET');
    if(hasBody) hdrs.push({key:'Content-Type', value:'application/json'});
    const body = c.secretBody ? { ...c.body, secret:'{{clientSecret}}' } : c.body;
    return {
      name: c.method+' '+pathPart,
      request: {
        method: c.method,
        header: hdrs,
        ...(hasBody ? { body:{ mode:'raw', raw: JSON.stringify(body,null,2),
                               options:{ raw:{ language:'json' } } } } : {}),
        url: {
          raw: '{{baseUrl}}'+c.path,
          host: ['{{baseUrl}}'],
          path: pathPart.split('/').filter(Boolean),
          ...(query ? { query: query.split('&').map(kv=>{
            const i=kv.indexOf('='); return { key:kv.slice(0,i), value:decodeURIComponent(kv.slice(i+1)) };
          }) } : {}),
        },
      },

function downloadPostman(){
  if(!state.exported.length){ toast('Make some calls first'); return; }
  const json = JSON.stringify(postmanCollection(), null, 2);
  try{
    const blob = new Blob([json], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dragonpass-playground.postman_collection.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast(state.exported.length+' calls exported');
  }catch(e){
    copyText(json).then(ok=>toast(ok?'Collection copied to clipboard':'Export failed'));
  }
}

/* JSON syntax highlighter. Escapes first, then tokenises — so a live response
   containing quotes, colons or markup can't break out of the <pre>. */
function hl(obj){
  let json;
  try{ json = JSON.stringify(obj,null,2); }catch(e){ json = String(obj); }
  if(json===undefined) json = String(obj);
  const safe = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return safe.replace(
    /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, lit, num)=>{
      if(str) return colon ? '<span class="k">'+str+'</span>'+colon : '<span class="s">'+str+'</span>';
      if(lit) return '<span class="n">'+lit+'</span>';
      if(num) return '<span class="n">'+num+'</span>';
      return m;
    });
}
function hlText(s){
  const safe = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return safe.replace(/("(?:\\.|[^"\\])*")|\b(curl|await|fetch|method|headers|body|new|Request|Builder|RequestBody|MediaType)\b/g,
    (m, str, kw)=> str ? '<span class="s">'+str+'</span>' : '<span class="k">'+kw+'</span>');
}

/* Bind the connection inputs. Values are read on input so a half-typed field is
   never lost when the rail re-renders. */
function wireConnection(wrap){
  const c = state.conn;
  const bind = (id, prop)=>{ const el=wrap.querySelector('#'+id); if(el) el.oninput=()=>{ c[prop]=el.value; }; };
  bind('cBase','base'); bind('cProgram','programId');
  bind('cClient','clientId'); bind('cSecret','secret'); bind('cToken','pastedToken');

  wrap.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{
    c.authMode=b.dataset.auth; c.status='idle'; c.message=''; renderLeft(); });

  const connect = wrap.querySelector('#connectBtn');
  if(connect) connect.onclick=async ()=>{
    if(!liveBase()){ c.status='error'; c.message='Set a base URL first.'; renderLeft(); return; }
    if(c.authMode==='token'){
      if(!c.pastedToken.trim()){ c.status='error'; c.message='Paste an access token first.'; renderLeft(); return; }
      state.token = c.pastedToken.trim();
      c.status='ok'; c.message='Token accepted. It will be sent as Authorization: Bearer on every call.';
      renderLeft(); return;
    }
    if(!c.clientId.trim() || !c.secret.trim()){
      c.status='error'; c.message='clientId and secret are both required.'; renderLeft(); return; }
    c.status='idle'; c.message='Requesting a token…'; renderLeft();
    state.token = null;
    const body = await logCall(()=>API.token());
    if(state.token){
      c.status='ok'; c.message='Connected. Token valid until '+
        (body?.data?.validUntil ? new Date(body.data.validUntil*1000).toISOString().slice(0,19).replace('T',' ')+' UTC' : 'the returned expiry')+'.';
    } else {
      c.status='error';
      /* The live API returns { code:-1, msg, errCode } — errCode is the
         documented ABC.DEF.GHI triple (e.g. 201.000.001 = invalid credentials). */
      const msg = String((body && (body.msg || body.message)) || '').replace(/\.\s*$/,'');
      c.message = body && body.code!==0
        ? ('Auth failed'+(body.errCode?' ['+body.errCode+']':'')+(msg?': '+msg:'')+'.')
        : 'Auth failed. Check the base URL and credentials.';
    }
    renderLeft();
  };

  const disconnect = wrap.querySelector('#disconnectBtn');
  if(disconnect) disconnect.onclick=()=>{
    c.clientId=''; c.secret=''; c.pastedToken=''; c.status='idle'; c.message='Credentials cleared.';
    state.token=null; renderLeft();
  };
}

/* `glyph` is pre-rendered icon markup from mIcon() or icon(), not a raw string. */
function toggleRow(kind,key,glyph,title,sub,on,dim){
  return `<div class="toggle ${on?'on':''} ${dim?'disabled':''}" data-kind="${kind}" data-key="${esc(key)}">
    <span class="tg-ic">${glyph}</span>
    <span class="tg-tx"><b>${esc(title)}</b><span>${esc(sub)}</span></span>
    <span class="switch"></span></div>`;
}
function applyConfig(cfg){
  state.solution = cfg.solution;
  state.cross = !!cfg.cross;
  Object.keys(state.modules).forEach(m=>state.modules[m]=cfg.modules.includes(m));
  Object.keys(state.caps).forEach(c=>state.caps[c]=cfg.caps.includes(c));
  state.pass=null; state.orders=[]; state.user=null; state.lastVoucher=null;
}
function applyPreset(id){
  const p = PRESETS.find(x=>x.id===id); if(!p) return;
  applyConfig(p.apply);
  state.recipe=null;
  resetNav(); renderAll();
}
/* Starting a recipe switches on exactly what that journey needs, so the user
   never has to work out which toggles the steps depend on. */
function startRecipe(id){
  const r = RECIPES[id]; if(!r) return;
  if(state.recipe===id){ state.recipe=null; renderAll(); return; }
  state.recipe=id;
  const done = state.recipeProgress[id] = new Set();
  /* A step whose precondition is already met should start ticked — otherwise a
     recipe begun after you already hold a token could never complete, because
     auto-auth only fires when there is no token. */
  if(state.token) r.steps.forEach((s,i)=>{ if(s.match==='/v2/auth/token') done.add(i); });
  if(r.apply) applyConfig(r.apply);
  resetNav(); renderAll();
}

/* ============================================================================
   CENTER APP — screen router
   ========================================================================== */
function resetNav(){ state.nav={ tab:'home', screen:'home', ctx:null, stack:[] }; }
function syncNav(){ if(state.nav.tab==='card' && state.solution!=='membership' && !state.pass) resetNav(); }
/* A back stack, so Back returns to the screen you actually came from — going
   from a resource straight back to the search box skips the listing you were
   browsing, which no real app does. `replace` is for screens that supersede the
   current one rather than stacking on it (a pass replacing the booking form). */
function go(screen,ctx,opts){
  const nav=state.nav;
  if(!nav.stack) nav.stack=[];
  if(opts&&opts.replace) nav.stack.pop();
  if(nav.screen!==screen || JSON.stringify(nav.ctx)!==JSON.stringify(ctx||null))
    nav.stack.push({ screen:nav.screen, ctx:nav.ctx });
  nav.screen=screen; nav.ctx=ctx||null;
  renderApp();
}
function goBack(){
  const nav=state.nav;
  const prev=(nav.stack||[]).pop();
  if(!prev){ setTab(nav.tab); return; }
  nav.screen=prev.screen; nav.ctx=prev.ctx;
  renderApp();
}
function setTab(tab){ state.nav.tab=tab; state.nav.screen=tab; state.nav.ctx=null; state.nav.stack=[]; renderApp(); }

/* Mirrors the DP app's Home / Explore / Membership / Account bar. The third tab
   is a wallet for E-pass programmes and a membership card for membership ones. */
function tabsConfig(){
  const tabs=[{id:'home',ic:'home',label:'Home'}];
  if(cap('search')) tabs.push({id:'search',ic:'search',label:'Explore'});
  tabs.push(state.solution==='membership'
    ? {id:'card',ic:'credit-card',label:'Membership'}
    : {id:'wallet',ic:'wallet',label:'Wallet'});
  tabs.push({id:'profile',ic:'user',label:'Account'});
  return tabs;
}

function renderApp(){
  const body=document.getElementById('appBody');
  const tabs=tabsConfig();
  if(!tabs.find(t=>t.id===state.nav.tab)) state.nav.tab='home';
  const sub = ['search','module','resource','book','esim','fitness','offers','voucher','pass','order'].includes(state.nav.screen);
  const backBtn=document.getElementById('backBtn');
  backBtn.style.display = sub?'grid':'none';
  backBtn.onclick=goBack;

  const screenNames={home:'Home',search:'Explore',wallet:'My wallet',card:'Membership',profile:'Account',
    module:'Browse',resource:'Details',book:'Book a slot',esim:'Data plans',fitness:'Sessions',
    offers:'Offers',voucher:'Your voucher',pass:'Your pass',order:'Order details'};
  document.getElementById('appScreenName').textContent=screenNames[state.nav.screen]||'';

  let html='';
  switch(state.nav.screen){
    case 'home':    html=screenHome(); break;
    case 'search':  html=screenSearch(); break;
    case 'module':  html=screenModule(state.nav.ctx); break;
    case 'resource':html=screenResource(state.nav.ctx); break;
    case 'book':    html=screenBook(state.nav.ctx); break;
    case 'esim':    html=screenEsim(); break;
    case 'fitness': html=screenFitness(state.nav.ctx); break;
    case 'offers':  html=screenOffers(state.nav.ctx); break;
    case 'voucher': html=screenVoucher(state.nav.ctx); break;
    case 'pass':    html=screenPass(state.nav.ctx); break;
    case 'order':   html=screenOrder(state.nav.ctx); break;
    case 'wallet':  html=screenWallet(); break;
    case 'card':    html=screenCard(); break;
    case 'profile': html=screenProfile(); break;
    default: html=screenHome();
  }
  body.innerHTML=html;
  wireApp(body);

  const tb=document.getElementById('appTabs');
  tb.innerHTML=tabs.map(t=>`<button class="${state.nav.tab===t.id?'on':''}" data-tab="${t.id}">
    ${icon(t.ic,'tabic')}<span>${esc(t.label)}</span></button>`).join('');
  tb.querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  manageQR();
  renderAdmin();   // the contextual group depends on the current screen
}

function screenResource(ctx){

  if(!r) return screenHome();
  let h=`<div class="rhero">
      <div class="rhero-img">${mIcon(mod,'lg')}</div>

        <b>${esc(r.name)}</b>

        <span class="pricepill">${esc(m.price)}</span>

     same screen serves gyms, eSIMs and merchants. */
  h+=`<p class="app-sub" style="margin:13px 2px 0">${esc(r.sub)}.</p>`;
  if(m.prebook)
    h+=`<p class="app-sub" style="margin:4px 2px 12px">Bookable up to 48h ahead · cancellable up to 48h before.</p>`;
  else
    h+=`<p class="app-sub" style="margin:4px 2px 12px">No booking needed — present your pass on arrival.</p>`;
  /* What a user can do here is the intersection of what the API supports for
     this module and which capabilities the integrator has switched on. */
  const canBook   = m.prebook && cap('prebooking');
  const canWalkIn = m.walkin  && cap('walkin');

  if(mod==='fitness' && m.schedule && canBook){
    h+=`<button class="btn ink" data-act="fitnessSchedule" data-mod="${mod}" data-res="${esc(res)}">View sessions</button>`;
  } else if(mod==='localoffer' && canBook){
    h+=`<button class="btn ink" data-act="offerBrowse" data-mod="${mod}" data-res="${esc(res)}">View offers</button>`;
  } else if(canBook){
    h+=`<button class="btn" data-act="goBook" data-mod="${mod}" data-res="${esc(res)}">Book a slot</button>`;

      h+=`<button class="btn ghost" data-act="bundle" data-mod="${mod}" data-res="${esc(res)}">Issue pass + book in one call</button>`;
  }
  if(canWalkIn){
    h+=`<button class="btn ${canBook?'ghost':''}" data-act="walkin" data-mod="${mod}" data-res="${esc(res)}">Get Pass</button>`;
  }

  if(!canBook && !canWalkIn){
    /* Say why, honestly — the module may simply not support this journey. */
    const apiSupports = [m.prebook&&'pre-booking', m.walkin&&'walk-in'].filter(Boolean);
    h+= apiSupports.length
      ? `<div class="app-note">${icon('info')}<span><b>${esc(m.label)}</b> supports ${esc(apiSupports.join(' and '))} on the DragonPass API.
          Switch that capability on in the left rail to use it here.</span></div>`
      : `<div class="app-note">${icon('ban')}<span>The API has no ordering endpoint for <b>${esc(m.label)}</b>.</span></div>`;
  } else if(!m.prebook){
    h+=`<div class="app-note">${icon('info')}<span><b>${esc(m.label)}</b> is walk-in only — the API has no
        prebooking order endpoint for module ${m.code}.</span></div>`;
  } else if(!m.walkin){
    h+=`<div class="app-note">${icon('info')}<span><b>${esc(m.label)}</b> is pre-booking only — there is no
        walk-in redemption for module ${m.code}.</span></div>`;
  }
  return h;
}
function screenBook(ctx){

/* ---------------------------------------------------------------------------
   PASS DISPLAY — built to the portal's UI Design Guidelines (doc 338654m0).

   Walk-in must show:    QR, Membership/E-pass ID, DragonPass logo, user's name,
                         expiration date.
   Prebooking must show: voucher no. + QR, DragonPass logo, user's name,
                         prebooking date & time, resource name & location.

   The QR encodes ONLY the id or voucher — the guidelines warn that including
   any additional text can make verification fail.
--------------------------------------------------------------------------- */
function screenPass(ctx){
  const kind = (ctx&&ctx.kind) || 'walkin';
  const name = state.user?.name || (PERSON.firstName+' '+PERSON.lastName);
  const dpLogo = `<svg class="dp-wm" aria-hidden="true"><use href="#dp-wordmark"></use></svg>`;

  if(kind==='prebooking'){
    const o = state.orders.find(x=>x.id===(ctx&&ctx.order)) || state.orders.find(x=>x.voucher);
    if(!o||!o.voucher) return `<div class="app-empty">${icon('ticket','xl')}<b>No booking yet</b>
      <span>Book a slot and the voucher will appear here.</span></div>`;
    const mk = keyByCode(o.module);
    const r  = mk && MODULES[mk].sample.find(x=>x.id===o.resourceId) ||
               (mk && MODULES[mk].sample[0]);
    return `
      <div class="pass" data-pass-kind="prebooking">
        <div class="pass-top">${dpLogo}<span class="pass-kind">Booking confirmed</span></div>
        <div class="pass-qr"><canvas id="qrCanvas" width="188" height="188" data-qr="${esc(o.voucher)}"></canvas></div>
        <div class="pass-code"><span>Voucher</span><b>${esc(o.voucher)}</b></div>
        <dl class="pass-meta">
          <div><dt>Name</dt><dd>${esc(name)}</dd></div>
          <div><dt>Date &amp; time</dt><dd>${esc(isoZ().slice(0,10))} · ${esc(o.slot||'10:00')}</dd></div>
          <div><dt>${esc(MODULE_NAME[o.module]||'Service')}</dt><dd>${esc(o.resName)}</dd></div>
          <div><dt>Location</dt><dd>${esc(r?r.loc:state.hub.name)}${mk&&MODULES[mk].lifestyle?'':' · '+esc(state.hub.name)}</dd></div>
        </dl>
        ${o.redemptionUrl ? `<a class="ord-link" href="${esc(o.redemptionUrl)}" target="_blank"
          rel="noopener noreferrer">${icon('link')} ${esc(o.redemptionUrl)}</a>` : ''}
        ${o.validUntil ? `<p class="pass-note">${icon('clock')} Voucher valid until
          ${esc(String(o.validUntil).slice(0,10))}.</p>` : ''}
        <p class="pass-note">${icon('info')} Present this voucher at the service point. For prebooking
          orders always use the voucher value — presenting the E-pass ID may be refused.</p>
      </div>`;
  }

  /* walk-in */
  if(!state.pass) return `<div class="app-empty">${icon('ticket','xl')}<b>No pass yet</b>
    <span>Pick a service and choose “Get Pass”.</span></div>`;
  const isMember = state.pass.type==='membership';
  const id = isMember ? state.pass.membershipId : state.pass.ePassId;
  const mod = ctx&&ctx.mod;
  const r = mod && MODULES[mod]?.sample.find(x=>x.id===(ctx&&ctx.res));
  const expiry = state.pass.expiry || isoZ(new Date(Date.now()+365*864e5));
  const redeemed = state.orders.some(o=>o.kind==='walkin'||o.kind==='sandbox');
  return `
    <div class="pass" data-pass-kind="walkin">
      <div class="pass-top">${dpLogo}<span class="pass-kind">${isMember?'Membership':'E-pass'}</span></div>
      <div class="pass-qr"><canvas id="qrCanvas" width="188" height="188" data-qr="${esc(id)}"></canvas></div>
      <div class="pass-code"><span>${isMember?'Membership ID':'E-pass ID'}</span><b>${esc(id)}</b></div>
      <dl class="pass-meta">
        <div><dt>Name</dt><dd>${esc(name)}</dd></div>
        <div><dt>Expires</dt><dd>${esc(String(expiry).slice(0,10))}</dd></div>
        ${state.pass.type==='cross'
          ? `<div><dt>Valid at</dt><dd>${esc((state.pass.allowedModules||[]).map(c=>MODULE_NAME[c]).join(' · '))}</dd></div>`
          : (r?`<div><dt>Venue</dt><dd>${esc(r.name)}</dd></div>`:'')}
      </dl>
      ${state.pass.type==='cross'
        ? `<p class="pass-note">${icon('info')} One access across the listed modules — the usage order
            re-attributes to whichever is actually used.</p>` : ''}
      ${redeemed
        ? `<p class="pass-note ok">${icon('badge-check')} Redeemed — the usage order is in your wallet.</p>`
        : `<button class="btn" data-act="doRedeem" data-mod="${esc(mod||'')}" data-res="${esc((ctx&&ctx.res)||'')}">
             Redeem now</button>
           <p class="pass-note">${icon('info')} Staff scan this code on arrival.
             ${cap('sandbox')?'Sandbox simulation is on, so this calls the simulation endpoint.':'This fires the walk-in redemption webhook.'}</p>`}
    </div>`;
}
